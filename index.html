<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
  <style>
    :root {
      --yellow: #FFC72C;
      --yellow-dark: #E6AC00;
      --black: #1A1A1A;
      --gray-900: #1F2023;
      --gray-700: #4B4D53;
      --gray-500: #8A8D93;
      --gray-200: #E7E8EB;
      --gray-100: #F4F5F7;
      --green: #1FAA59;
      --red: #E5484D;
      --white: #FFFFFF;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--gray-100);
      color: var(--gray-900);
    }
    header {
      background: var(--black);
      color: var(--white);
      padding: 18px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    header .brand { display: flex; align-items: center; gap: 10px; }
    header .brand-mark {
      width: 34px; height: 34px; border-radius: 8px;
      background: var(--yellow);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: var(--black);
    }
    header h1 { font-family: 'Space Grotesk', sans-serif; font-size: 18px; margin: 0; }
    header .sub { font-size: 12px; color: var(--gray-500); margin-top: 2px; }
    header .meta { font-size: 12px; color: var(--gray-500); text-align: right; }
    main { padding: 24px 28px 60px; max-width: 1280px; margin: 0 auto; }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }
    .kpi-card {
      background: var(--white);
      border-radius: 14px;
      padding: 16px 18px;
      border: 1px solid var(--gray-200);
    }
    .kpi-card .label { font-size: 12px; color: var(--gray-500); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
    .kpi-card .value { font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; margin-top: 6px; }
    .kpi-card .delta { font-size: 12px; margin-top: 4px; font-weight: 600; }
    .delta.up { color: var(--green); }
    .delta.down { color: var(--red); }

    .panel {
      background: var(--white);
      border-radius: 16px;
      border: 1px solid var(--gray-200);
      padding: 20px;
      margin-bottom: 24px;
    }
    .panel h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px;
      margin: 0 0 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel h2 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--yellow); display: inline-block; }

    .grid-2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; }
    @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--gray-200); }
    th { color: var(--gray-500); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.03em; }
    tr:hover td { background: var(--gray-100); }
    .badge { padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; display: inline-block; }
    .badge.active { background: #E6F7EC; color: var(--green); }
    .badge.inactive { background: #FBEAEA; color: var(--red); }
    .badge.churn { background: #1A1A1A; color: var(--white); }

    .leaderboard-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 4px; border-bottom: 1px solid var(--gray-200);
    }
    .leaderboard-row:last-child { border-bottom: none; }
    .lb-rank {
      width: 26px; height: 26px; border-radius: 50%; background: var(--yellow);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 12px; margin-right: 10px;
    }
    .lb-name-wrap { display: flex; align-items: center; }
    .lb-name { font-weight: 600; font-size: 14px; }
    .lb-sub { font-size: 12px; color: var(--gray-500); }
    .lb-stat { text-align: right; }
    .lb-stat .big { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px; }

    .zone-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
    .zone-card { background: var(--gray-100); border-radius: 12px; padding: 12px 14px; }
    .zone-card .z-name { font-weight: 700; font-family: 'Space Grotesk', sans-serif; }
    .zone-card .z-stat { font-size: 12px; color: var(--gray-700); margin-top: 4px; }

    select, input[type=text] {
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 7px 10px; border-radius: 8px; border: 1px solid var(--gray-200);
      font-size: 13px; background: var(--white);
    }
    .controls { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }

    .loading { text-align: center; padding: 60px 0; color: var(--gray-500); }
    footer { text-align: center; padding: 20px; font-size: 12px; color: var(--gray-500); }
    canvas { max-height: 260px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-mark">CB</div>
      <div>
        <h1>Team Rashid — DOD Dashboard</h1>
        <div class="sub">Merchant &amp; KAM performance · Ahmed Asif Rashid · Nuruzzaman Nahid · MD Solayman Shadik Shady</div>
      </div>
    </div>
    <div class="meta" id="meta">Loading…</div>
  </header>

  <main>
    <div id="content" class="loading">Fetching live data from the sheet…</div>
  </main>

  <footer>Powered by NAHID</footer>

  <script>
    // Deployed Apps Script web app URL (acts as a JSON data proxy for the Sheet)
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxIqdFAGHNRDx6y2eD_mhciYub0emHMeH3vLGh-0S2eUoqkryPvjpDZt-ENDAAbCFIp/exec';

    fetch(SCRIPT_URL)
      .then(function (r) {
        if (!r.ok) throw new Error('Request failed with status ' + r.status);
        return r.json();
      })
      .then(render)
      .catch(showError);

    function showError(err) {
      document.getElementById('content').innerHTML =
        '<div class="panel"><h2>Couldn\'t load data</h2><p style="color:#E5484D">' + err.message + '</p></div>';
    }

    function fmt(n) { return Number(n || 0).toLocaleString('en-US'); }
    function pctBadge(v) {
      const cls = v >= 0 ? 'up' : 'down';
      const sign = v >= 0 ? '▲' : '▼';
      return '<span class="delta ' + cls + '">' + sign + ' ' + Math.abs(v).toFixed(1) + '%</span>';
    }
    function statusBadge(inactiveStatus, churnStatus) {
      if (churnStatus === 'Churn') return '<span class="badge churn">Churn</span>';
      if (inactiveStatus === 'Active') return '<span class="badge active">Active</span>';
      return '<span class="badge inactive">Inactive</span>';
    }

    let DATA = null;

    function render(data) {
      DATA = data;
      document.getElementById('meta').innerText =
        'Data through ' + (data.lastDay || '—') + ' · Updated ' + new Date(data.generatedAt).toLocaleString();

      const k = data.kpis;
      const html = `
        <div class="kpi-grid">
          <div class="kpi-card">
            <div class="label">Total Merchants</div>
            <div class="value">${fmt(k.totalMerchants)}</div>
          </div>
          <div class="kpi-card">
            <div class="label">Active Merchants</div>
            <div class="value">${fmt(k.activeMerchants)}</div>
          </div>
          <div class="kpi-card">
            <div class="label">Churned</div>
            <div class="value">${fmt(k.churnedMerchants)}</div>
          </div>
          <div class="kpi-card">
            <div class="label">Today's Orders</div>
            <div class="value">${fmt(k.todayOrders)}</div>
          </div>
          <div class="kpi-card">
            <div class="label">July MTD Orders</div>
            <div class="value">${fmt(k.julyTillDayTotal)}</div>
            ${pctBadge(k.growthPctTillDay)}<span style="font-size:11px;color:var(--gray-500)"> vs June (same days)</span>
          </div>
        </div>

        <div class="grid-2">
          <div class="panel">
            <h2><span class="dot"></span>14-Day Parcel Trend</h2>
            <canvas id="trendChart"></canvas>
          </div>
          <div class="panel">
            <h2><span class="dot"></span>KAM Leaderboard</h2>
            <div id="leaderboard"></div>
          </div>
        </div>

        <div class="panel">
          <h2><span class="dot"></span>Pickup Zone Breakdown</h2>
          <div class="zone-grid" id="zoneGrid"></div>
        </div>

        <div class="panel">
          <h2><span class="dot"></span>Merchant-wise DOD Detail</h2>
          <div class="controls">
            <select id="kamFilter">
              <option value="">All KAMs</option>
            </select>
            <input type="text" id="searchBox" placeholder="Search merchant name…">
          </div>
          <div style="overflow-x:auto">
            <table>
              <thead>
                <tr>
                  <th>Merchant</th><th>KAM</th><th>Category</th><th>Zone</th>
                  <th>Active Days</th><th>Today</th><th>July MTD</th><th>Status</th>
                </tr>
              </thead>
              <tbody id="merchantRows"></tbody>
            </table>
          </div>
        </div>
      `;
      document.getElementById('content').innerHTML = html;
      document.getElementById('content').classList.remove('loading');

      drawTrend(data.trend);
      drawLeaderboard(data.kamStats);
      drawZones(data.zoneBreakdown);
      setupKamFilter(data.kamStats);
      drawMerchants(data.merchants);

      document.getElementById('kamFilter').addEventListener('change', applyFilters);
      document.getElementById('searchBox').addEventListener('input', applyFilters);
    }

    function drawTrend(trend) {
      const ctx = document.getElementById('trendChart').getContext('2d');
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: trend.map(t => t.day),
          datasets: [{
            label: 'Parcels',
            data: trend.map(t => t.total),
            borderColor: '#E6AC00',
            backgroundColor: 'rgba(255,199,44,0.15)',
            fill: true,
            tension: 0.35,
            pointRadius: 3
          }]
        },
        options: {
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true } }
        }
      });
    }

    function drawLeaderboard(kamStats) {
      const el = document.getElementById('leaderboard');
      el.innerHTML = kamStats.map((k, i) => `
        <div class="leaderboard-row">
          <div class="lb-name-wrap">
            <div class="lb-rank">${i + 1}</div>
            <div>
              <div class="lb-name">${k.kam}</div>
              <div class="lb-sub">${k.merchants} merchants · ${k.active} active · ${k.churn} churned</div>
            </div>
          </div>
          <div class="lb-stat">
            <div class="big">${fmt(k.julyTillDay)}</div>
            ${pctBadge(k.growth)}
          </div>
        </div>
      `).join('');
    }

    function drawZones(zones) {
      const el = document.getElementById('zoneGrid');
      el.innerHTML = zones.map(z => `
        <div class="zone-card">
          <div class="z-name">${z.zone}</div>
          <div class="z-stat">${z.merchants} merchants</div>
          <div class="z-stat">${fmt(z.julyTillDay)} orders (MTD)</div>
          <div class="z-stat">${fmt(z.todayOrders)} today</div>
        </div>
      `).join('');
    }

    function setupKamFilter(kamStats) {
      const sel = document.getElementById('kamFilter');
      kamStats.forEach(k => {
        const opt = document.createElement('option');
        opt.value = k.kam; opt.textContent = k.kam;
        sel.appendChild(opt);
      });
    }

    function drawMerchants(list) {
      const tbody = document.getElementById('merchantRows');
      tbody.innerHTML = list.map(m => `
        <tr data-kam="${m.kam}" data-name="${m.name.toLowerCase()}">
          <td>${m.name}</td>
          <td>${m.kam}</td>
          <td>${m.category}</td>
          <td>${m.zone}</td>
          <td>${m.activeDays}</td>
          <td>${fmt(m.today)}</td>
          <td>${fmt(m.julyTillDay)}</td>
          <td>${statusBadge(m.inactiveStatus, m.churnStatus)}</td>
        </tr>
      `).join('');
    }

    function applyFilters() {
      const kam = document.getElementById('kamFilter').value;
      const search = document.getElementById('searchBox').value.toLowerCase();
      document.querySelectorAll('#merchantRows tr').forEach(row => {
        const matchesKam = !kam || row.dataset.kam === kam;
        const matchesSearch = !search || row.dataset.name.indexOf(search) !== -1;
        row.style.display = (matchesKam && matchesSearch) ? '' : 'none';
      });
    }
  </script>
</body>
</html>
